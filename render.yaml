services:
  - type: web
    name: relaybrowse            # -> https://relaybrowse.onrender.com
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: AUTH_TOKEN
        generateValue: true      # copy the generated value from the Render dashboard; it's your access key
      - key: FRONTEND_ORIGIN
        value: https://YOUR-FRONTEND-DOMAIN   # e.g. https://relaybrowse-web.onrender.com
      - key: TRUST_PROXY
        value: "1"

  - type: web
    name: relaybrowse-web
    runtime: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
